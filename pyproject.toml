[project]
name = "chosm"
version = "0.0.5"
description = "Experimental 'Centred Horizon Ordered Sprite Montage' engine, bootstrapped from Might and Magic game data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.1",
    "boltons>=24.0",
    "fastapi>=0.115",
    "imageio>=2.34",
    "jinja2>=3.1",
    "numba>=0.60",
    "numpy>=1.26",
    "orjson>=3.10",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "python-slugify>=8.0",
    "sqlalchemy>=2.0",
    "sympy>=1.13",
    "toml>=0.10",
    "translators>=5.9",
    "uvicorn[standard]>=0.30",
    "xxhash>=3.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
# an application, not a library: dependencies only, the project itself is not installed
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
